<!doctype html>
<!-- Signal: the V4 prototype, refactored into folders. Screens and scope follow 04-production/PRD.md. Synthetic data only. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal V4 · Weekly metrics</title>
  <!-- Styles load in this order on purpose: later files restyle earlier ones. -->
  <link rel="stylesheet" href="styles/1-base.css">
  <link rel="stylesheet" href="styles/2-shared.css">
  <link rel="stylesheet" href="styles/3-churn-detail.css">

  <div class="app">
    <div id="sidebar"></div>
    <div class="content">
      <div id="screens"></div>
      <footer>Signal V4 prototype. Demo with synthetic data. No real customer or company data is used.</footer>
    </div>

  <script src="config.js"></script>
  <!-- Supabase JS library (sign-in sessions), pinned to an exact version. -->

  <!-- 1. Data: synthetic numbers, thresholds and wording. No display code. -->
  <script src="data/churn-data.js"></script>
  <script src="data/supporting-metrics-data.js"></script>
  <script src="data/thresholds.js"></script>
  <script src="data/most-important-insight.js"></script>
  <script src="data/recommended-actions-data.js"></script>
  <script src="data/messages.js"></script>

  <script src="logic/format.js"></script>
  <script src="logic/churn-calculations.js"></script>
  <script src="logic/network.js"></script>
  <script src="logic/auth.js"></script>
  <script src="logic/churn-data-service.js"></script>

  <script src="components/shared/KpiScale.js"></script>
  <script src="components/shared/Sidebar.js"></script>

  <script src="components/churn-detail/PlanContributionChart.js"></script>
  <script src="components/churn-detail/PlanBreakdown.js"></script>
  <script src="components/churn-detail/ChurnDetailScreen.js"></script>

  <script src="components/recommended-actions/PrimaryActionCard.js"></script>
  <script src="components/recommended-actions/ExecutionPlan.js"></script>
  <script src="components/recommended-actions/SuccessMeasures.js"></script>
  <script src="components/recommended-actions/RecommendedActionsScreen.js"></script>

  <!-- 4. Navigation and start-up. -->
  <script src="router.js"></script>
  <script src="app.js"></script>

</html>
